  <rect x="126" y="78" width="18" height="18" fill="#e8f5fa"/><text x="155" y="92" class="legend">Neve</text>
  <rect x="244" y="78" width="18" height="18" fill="#c66d45"/><text x="273" y="92" class="legend">Badlands</text>
