<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960" role="img" aria-label="Mappa strategica del seed di Minecraft Rinascita">
<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087ac4"/><stop offset=".48" stop-color="#07528c"/><stop offset="1" stop-color="#062f5b"/></linearGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#9ee8ff" stroke-opacity=".18"/></pattern>
  <pattern id="forest" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#159447"/><path d="M0 31L11 19l12 7 17-13v27H0Z" fill="#0c6a3e" opacity=".55"/><circle cx="8" cy="11" r="3" fill="#32ca6c"/></pattern>
  <pattern id="plains" width="42" height="42" patternUnits="userSpaceOnUse"><rect width="42" height="42" fill="#6fd47b"/><path d="M0 32L16 23 28 28 42 18V42H0Z" fill="#48b963" opacity=".52"/></pattern>
  <pattern id="desert" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#e6bf58"/><path d="M0 31L13 24 24 29 44 16V44H0Z" fill="#cf9f3e" opacity=".48"/></pattern>
  <pattern id="snow" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#e8f5fa"/><path d="M0 31L16 20 31 27 44 16V44H0Z" fill="#c1dce8" opacity=".72"/></pattern>
  <pattern id="badlands" width="46" height="46" patternUnits="userSpaceOnUse"><rect width="46" height="46" fill="#c66d45"/><path d="M0 33L11 19 24 29 35 14 46 19v27H0Z" fill="#a24737" opacity=".55"/></pattern>
  <pattern id="cherry" width="38" height="38" patternUnits="userSpaceOnUse"><rect width="38" height="38" fill="#bdf09a"/><circle cx="8" cy="9" r="5" fill="#f29bc4"/><circle cx="23" cy="6" r="4" fill="#ffa8d0"/><circle cx="30" cy="22" r="5" fill="#ea7fb8"/><path d="M10 15v15M25 12v18" stroke="#5f9c53" stroke-width="3"/></pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".4"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .coord{font: 20px Arial,sans-serif;fill:#e6f7ff}
    .legend{font:16px Arial,sans-serif;fill:#eaf6ff}
    .tiny{font:13px Arial,sans-serif;fill:#bfe6f5}
    .label{font:700 17px Arial,sans-serif;fill:#fff;paint-order:stroke;stroke:#0b2034;stroke-width:5}
  </style>
</defs>

<rect width="1800" height="960" fill="#052a4c"/>
<rect x="28" y="28" width="1744" height="904" rx="28" fill="url(#sea)" stroke="#20d5ff" stroke-width="2"/>
<rect x="48" y="48" width="1704" height="864" rx="22" fill="url(#grid)" opacity=".75"/>

<!-- map frame & subtle latitude bands -->
<g opacity=".18" stroke="#b3efff" stroke-width="2" stroke-dasharray="7 12">
  <path d="M80 240H1720M80 440H1720M80 640H1720M80 820H1720"/>
  <path d="M300 70V890M600 70V890M900 70V890M1200 70V890M1500 70V890"/>
</g>

<!-- LANDMASSES -->
