  <circle cx="713" cy="430" r="17" fill="#fff"/><path d="M704 428h18l-3 13h-12z" fill="#2b79bb"/>
  <!-- village icons -->
  <g fill="#fff" stroke="#0b2034" stroke-width="4">
    <path d="M177 233l25-24 25 24v33h-50z" fill="#ffe3b5"/><path d="M171 233l31-32 31 32-8 7-23-25-23 25z" fill="#d87c3f"/>
    <path d="M1250 221l25-24 25 24v32h-50z" fill="#ffe3b5"/><path d="M1244 221l31-32 31 32-8 7-23-25-23 25z" fill="#d87c3f"/>
    <path d="M1535 303l25-24 25 24v32h-50z" fill="#ffe3b5"/><path d="M1529 303l31-32 31 32-8 7-23-25-23 25z" fill="#d87c3f"/>
    <path d="M416 774l25-24 25 24v32h-50z" fill="#ffe3b5"/><path d="M410 774l31-32 31 32-8 7-23-25-23 25z" fill="#d87c3f"/>
  </g>
  <!-- structures -->
  <g>
    <circle cx="520" cy="335" r="27" fill="#242b35" stroke="#bdf2ff" stroke-width="4"/><path d="M503 350v-27l17-11 17 11v27z" fill="#6f8090"/>
    <circle cx="1050" cy="228" r="27" fill="#702bba" stroke="#efc1ff" stroke-width="4"/><path d="M1037 228h26v31h-26z" fill="#2f163d"/><path d="M1042 239h16v14h-16z" fill="#bc6cff"/>
    <circle cx="1185" cy="607" r="27" fill="#152338" stroke="#bdf2ff" stroke-width="4"/><path d="M1171 604l14-18 14 18v28h-28z" fill="#5e7489"/>
    <circle cx="463" cy="592" r="27" fill="#14b9b9" stroke="#bffcff" stroke-width="4"/><path d="M450 613v-20l13-13 13 13v20z" fill="#77f7e2"/>
