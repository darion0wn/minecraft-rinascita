  <path d="M120 472L211 448 293 473 353 439 427 476 466 548 437 619 362 648 291 633 231 666 154 622 109 548Z" fill="url(#forest)" stroke="#0a5d3b" stroke-width="6"/>
  <!-- south cherry -->
  <path d="M472 545L551 504 630 526 687 575 669 650 612 681 542 666 486 628Z" fill="url(#cherry)" stroke="#b66f9a" stroke-width="5"/>
  <!-- south snow -->
  <path d="M746 520L812 484 892 514 948 568 925 642 865 681 783 655 735 603Z" fill="url(#snow)" stroke="#b9d5e2" stroke-width="5"/>
  <!-- far south desert -->
  <path d="M974 689L1058 635 1166 651 1243 704 1240 804 1170 864 1073 845 1014 801Z" fill="url(#desert)" stroke="#c89b3e" stroke-width="6"/>
  <!-- southwest -->
  <path d="M128 702L230 674 322 708 382 765 347 845 259 872 175 835 116 788Z" fill="url(#plains)" stroke="#4da860" stroke-width="6"/>
</g>

<!-- small islands -->
<g fill="url(#forest)" stroke="#0a5d3b" stroke-width="4">
<path d="M70 370l47-29 58 17 15 45-42 36-61-11z"/>
<path d="M1510 560l55-34 59 24 8 54-47 25-60-20z"/>
<path d="M1558 700l46-22 57 28-9 48-62 8z"/>
<path d="M620 760l48-21 52 26-11 44-56 19-45-28z"/>
<path d="M380 176l48-15 39 25-9 40-56 13-34-29z"/>
</g>

<!-- coordinate axes -->
<g class="coord">
  <text x="86" y="63">-4000</text><text x="405" y="63">-3000</text><text x="720" y="63">-2000</text><text x="1038" y="63">-1000</text><text x="1356" y="63">0</text><text x="1600" y="63">1000</text>
  <text x="36" y="170">-3000</text><text x="36" y="370">-2000</text><text x="36" y="568">-1000</text><text x="56" y="768">0</text>
</g>

<!-- north compass -->
<g transform="translate(1635 128)" filter="url(#glow)">
