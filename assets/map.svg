  <!-- central large land -->
  <path d="M360 335L435 298 530 324 615 305 711 334 790 307 890 332 958 309 1042 345 1144 314 1234 348 1291 408 1272 493 1308 565 1263 647 1171 656 1104 706 1013 683 935 732 848 705 778 742 695 700 622 718 558 688 487 708 425 668 397 602 428 524 395 448 420 380 398Z" fill="url(#plains)" stroke="#4da860" stroke-width="7"/>
  <!-- deserts in central east -->
  <path d="M1052 390L1142 346 1243 372 1291 435 1278 505 1199 545 1114 532 1070 478Z" fill="url(#desert)" stroke="#c89b3e" stroke-width="5"/>
  <!-- badlands -->
